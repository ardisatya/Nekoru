services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nekoru
      POSTGRES_USER: nekoru
      POSTGRES_PASSWORD: nekoru
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nekoru -d nekoru"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
